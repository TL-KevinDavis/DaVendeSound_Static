<!-- Header -->
<header class="pt-2 pt-lg-3">
  <!-- Logo/Title Section -->
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="text-center border border-warning border-3 pb-0 mx-2 mx-md-0">
          <h1 class="fw-bold fst-italic display-1 text-warning m-0 px-2">DaVende Sound</h1>
          <p class="fs-1 mt-0 pt-0 mb-2 text-white fw-bold pb-0 px-2">Premier DJ, Sound and Lighting Services</p>
          <!-- Contact Info -->
          <div class="container-fluid mt-2 mb-0 mt-lg-3">
            <p class="fw-bold fst-italic fs-4 text-white text-center mb-0 px-2" style="line-height: 1.2;">
              Call <a href="tel:601-456-0007" class="text-warning text-decoration-none">601-456-0007</a>
              or email <a href="mailto:sales@davendesound.com" class="text-warning text-decoration-none">sales@davendesound.com</a>
            </p>
          </div>
          <!-- Navigation Elements -->
          <nav class="navbar navbar-expand-lg navbar-dark w-100 p-0 m-0 mb-0 mb-lg-0 pb-0 pb-lg-0">
            <div class="container-fluid py-0 my-0">
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto my-0 mb-0">
                  <li class="nav-item px-2">
                    <a class="nav-link fw-semibold text-decoration-none custom-nav-link"
                       routerLink="/"
                       routerLinkActive="text-warning"
                       [routerLinkActiveOptions]="{ exact: true }"
                       (click)="closeNavbar()">Home</a>
                  </li>
                  <li class="nav-item px-2">
                    <a class="nav-link fw-semibold text-decoration-none custom-nav-link" routerLink="/dj-packages" routerLinkActive="text-warning" (click)="closeNavbar()">DJ Packages</a>
                  </li>
                  <li class="nav-item px-2">
                    <a class="nav-link fw-semibold text-decoration-none custom-nav-link" routerLink="/photos-video" routerLinkActive="text-warning" (click)="closeNavbar()">Photo/Video</a>
                  </li>
                  <li class="nav-item px-2">
                    <a class="nav-link fw-semibold text-decoration-none custom-nav-link" routerLink="/pro-sound" routerLinkActive="text-warning" (click)="closeNavbar()">Pro-Sound</a>
                  </li>
                  <li class="nav-item px-2">
                    <a class="nav-link fw-semibold text-decoration-none custom-nav-link" routerLink="/locations" routerLinkActive="text-warning" (click)="closeNavbar()">Locations</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="container-fluid py-0 py-lg-0">
  <div class="row justify-content-center">
    <div class="p-0 m-3 clearfix d-block col-12 col-lg-10" style="max-width: 1000px;">
      <router-outlet></router-outlet>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="border-top footer text-muted mt-4 py-3 py-lg-4">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 text-center text-md-start" style="color: white">
        <p class="fs-6 m-0">&copy; 2026 - DaVende Sound</p>
        <p class="fs-6 m-0">
          Email: <a href="mailto:sales@davendesound.com" class="text-warning text-decoration-none">sales@davendesound.com</a> |
          Phone: <a href="tel:601-456-0007" class="text-warning text-decoration-none">(601)456-0007</a>
        </p>
        <p class="fs-6 m-0">Version 2.2.1</p>
      </div>
    </div>
  </div>
</footer>
